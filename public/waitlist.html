<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waitlist</title>
<style>
  :root{
    --bg:#070a14; --accent:#6c5ce7; --accent2:#00d2ff; --txt:#e8edff; --muted:#94a0c4;
    --grad:linear-gradient(135deg,#6c5ce7,#00d2ff); --panel:rgba(20,27,48,.7);
    --stroke:rgba(120,140,200,.18); --good:#2bd9a0; --faint:#5e6a8f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);background:radial-gradient(1100px 700px at 50% -10%,rgba(108,92,231,.22),transparent 60%),var(--bg);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--stroke);border-radius:22px;
    padding:38px 34px;box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px);text-align:center;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent2);
    border:1px solid var(--stroke);padding:5px 12px;border-radius:999px;margin-bottom:18px}
  h1{font-size:27px;margin:0 0 10px;line-height:1.2;font-weight:780}
  .tag{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
  .pain{background:rgba(108,92,231,.08);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
    padding:12px 16px;text-align:left;font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 22px}
  form{display:flex;flex-direction:column;gap:11px;text-align:left}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input,select{background:rgba(10,15,30,.7);border:1px solid var(--stroke);color:var(--txt);
    padding:13px 14px;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.15s}
  input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(0,210,255,.14)}
  button{margin-top:6px;background:var(--grad);color:#fff;border:none;padding:14px;border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 10px 26px rgba(108,92,231,.4)}
  button:hover{filter:brightness(1.07);transform:translateY(-1px)}
  button:disabled{opacity:.6;cursor:default;transform:none;filter:none}
  .count{font-size:12.5px;color:var(--faint);margin-top:14px}
  .count b{color:var(--good)}
  .ok{display:none;text-align:center;padding:10px 0}
  .ok.show{display:block;animation:rise .4s ease both}
  .ok .big{font-size:34px;margin-bottom:8px}
  .ok h2{margin:0 0 6px;font-size:22px}
  .ok p{color:var(--muted);font-size:14px;margin:0}
  .err{display:none;color:var(--bad);font-size:13px;margin-top:8px;text-align:center}
  .err.show{display:block}
  .foot{margin-top:22px;font-size:12px;color:var(--faint)}
  .back{display:inline-block;margin-top:18px;font-size:12.5px;color:var(--muted)}
  .nf{text-align:center}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="nf" id="nf" style="display:none">
    <h1>Experiment not found</h1>
    <p class="tag">This waitlist isn't active yet. Check back soon.</p>
    <a class="back" href="/">← Back to command center</a>
  </div>
  <div id="content">
    <span class="badge" id="cat">Early Access</span>
    <h1 id="name">Loading…</h1>
    <p class="tag" id="tag"></p>
    <div class="pain" id="pain"></div>
    <form id="form">
      <div class="field">
        <label for="name_i">Name</label>
        <input id="name_i" name="name" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email_i">Email</label>
        <input id="email_i" name="email" type="email" required placeholder="you@company.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="ch_i">How did you hear about us?</label>
        <select id="ch_i" name="channel">
          <option value="twitter">Twitter / X</option>
          <option value="reddit">Reddit</option>
          <option value="linkedin">LinkedIn</option>
          <option value="producthunt">Product Hunt</option>
          <option value="other">Other</option>
        </select>
      </div>
      <!-- hidden fields for Formspree -->
      <input type="hidden" name="_subject" id="fs_subject" value="" />
      <input type="hidden" name="project" id="fs_project" value="" />
      <button id="submit" type="submit">Join the waitlist</button>
    </form>
    <div class="err" id="errmsg">Something went wrong. Please try again — your email is safe.</div>
    <div class="ok" id="ok">
      <div class="big">🎉</div>
      <h2>You're on the list!</h2>
      <p id="okmsg"></p>
    </div>
    <div class="count" id="count"></div>
    <div class="foot">No spam. We'll only email you when <span id="pname2">this</span> is ready.<br/>
      <a class="back" href="/">← Back to command center</a>
    </div>
  </div>
</div>

<script>
  // ═══════════════════════════════════════════════════════════════
  // CONFIGURE THIS before deploying:
  //   1. Go to https://formspree.io → create a free form → copy the ID (e.g. "xwkdzbng")
  //   2. Paste that ID below.
  //   Leave empty to only use the local server (e.g. when served via ngrok / same origin).
  // ═══════════════════════════════════════════════════════════════
  // Replaced server-side if FORMSPREE_ID env var is set.
  var FORMSPREE_ID = '/*__FORMSPREE_ID__*/';

  var PROJECT = /*__PROJECT_JSON__*/null;
  if (!PROJECT) {
    document.getElementById('content').style.display = 'none';
    document.getElementById('nf').style.display = 'block';
  } else {
    document.getElementById('name').textContent = PROJECT.name;
    document.getElementById('pname2').textContent = PROJECT.name;
    document.getElementById('cat').textContent = PROJECT.category + ' · Early Access';
    document.getElementById('tag').textContent = PROJECT.tagline;
    document.getElementById('pain').textContent = 'The problem: ' + PROJECT.pain_summary;
    document.getElementById('count').innerHTML = '🎯 Goal: <b>' + PROJECT.waitlist_target + '</b> founding members before we start building.';
    // Formspree hidden fields
    document.getElementById('fs_subject').value = 'New waitlist signup: ' + PROJECT.name;
    document.getElementById('fs_project').value = PROJECT.slug;

    // If FORMSPREE_ID looks like a template placeholder, treat as unset.
    if (FORMSPREE_ID && FORMSPREE_ID.indexOf('__FORMSPREE_ID__') >= 0) FORMSPREE_ID = '';

    var form = document.getElementById('form');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Joining…';
      document.getElementById('errmsg').classList.remove('show');

      var name = document.getElementById('name_i').value.trim();
      var email = document.getElementById('email_i').value.trim();
      var channel = document.getElementById('ch_i').value;
      var slug = PROJECT.slug;
      var ok = false;

      // 1) Submit to Formspree (real email capture — works on any public URL)
      if (FORMSPREE_ID) {
        try {
          var fd = new FormData();
          fd.append('name', name);
          fd.append('email', email);
          fd.append('channel', channel);
          fd.append('project', slug);
          fd.append('_subject', 'Waitlist: ' + PROJECT.name);
          var fsResp = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {
            method: 'POST',
            body: fd,
            headers: { 'Accept': 'application/json' }
          });
          if (fsResp.ok) { ok = true; }
        } catch (e) {
          // Formspree unreachable — fall through to local-only
        }
      }

      // 2) Also submit to the local dashboard API (if same-origin / reachable)
      try {
        var localResp = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: slug, name: name, email: email, channel: channel })
        });
        var data = await localResp.json();
        ok = true; // local succeeded
        // Show position + threshold status
        form.style.display = 'none';
        var okDiv = document.getElementById('ok');
        okDiv.classList.add('show');
        document.getElementById('okmsg').textContent = data.reached
          ? "You're #" + data.total + " — we just hit the threshold, so we're starting to build. You'll get first access."
          : "You're #" + data.total + " on the list. We'll email you the moment we open.";
        return;
      } catch (e) {
        // Local API unreachable (common when deployed to Netlify etc.)
        // That's fine — Formspree already captured the email.
      }

      if (ok) {
        // Formspree-only success (local API was unreachable)
        form.style.display = 'none';
        document.getElementById('ok').classList.add('show');
        document.getElementById('okmsg').textContent = "You're on the list. We'll email you when " + PROJECT.name + " is ready.";
      } else {
        // Both failed
        btn.disabled = false;
        btn.textContent = 'Join the waitlist';
        document.getElementById('errmsg').classList.add('show');
      }
    });
  }
</script>
</body>
</html>
